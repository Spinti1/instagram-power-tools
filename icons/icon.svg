<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <!-- Instagram Neon Glow Gradient -->
    <linearGradient id="igGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Obsidian Rounded Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="64" cy="64" r="44" fill="url(#centerGlow)" />

  <!-- Outer Neon Gradient Ring -->
  <rect x="22" y="22" width="84" height="84" rx="22" fill="none" stroke="url(#igGlow)" stroke-width="6" filter="url(#neonShadow)" />

  <!-- Camera Aperture Central Circle -->
  <circle cx="64" cy="64" r="21" fill="none" stroke="url(#igGlow)" stroke-width="5.5" />

  <!-- Flash Pip / Lightning Accent -->
  <circle cx="86" cy="42" r="5" fill="#f43f5e" />
  <circle cx="86" cy="42" r="3" fill="#ffffff" />

  <!-- Ghost Hood / Lens Reflections -->
  <circle cx="58" cy="58" r="4" fill="#ffffff" opacity="0.85" />
</svg>
